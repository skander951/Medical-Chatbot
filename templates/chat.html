<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Medical Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">
      <div class="chatbot-avatar">
        <i class="fas fa-robot"></i>
      </div>
      <div>
        <h2>Medical Chatbot</h2>
        <p>Ask me anything!</p>
      </div>
    </header>

    <main id="messageArea" class="chat-body">
      <!-- Messages will appear here -->
    </main>

    <footer class="chat-footer">
      <form id="chatForm">
        <input type="text" id="text" placeholder="Type your message..." required autocomplete="off">
        <button type="submit"><i class="fas fa-paper-plane"></i></button>
      </form>
    </footer>
  </div>

  <script>
    $(document).ready(function () {
      $("#chatForm").on("submit", function (event) {
        event.preventDefault();

        const date = new Date();
        const time = date.getHours() + ":" + String(date.getMinutes()).padStart(2, "0");
        const rawText = $("#text").val();

        // User message
        const userHtml = `
          <div class="message user">
            <div class="bubble">${rawText}<span class="time">${time}</span></div>
          </div>`;
        $("#messageArea").append(userHtml);
        $("#text").val("");
        $(".chat-body").scrollTop($(".chat-body")[0].scrollHeight);

        // AJAX to Flask
        $.ajax({
          type: "POST",
          url: "/get",
          data: { msg: rawText },
        }).done(function (data) {
          const botHtml = `
            <div class="message bot">
              <div class="bubble">${data}<span class="time">${time}</span></div>
            </div>`;
          $("#messageArea").append(botHtml);
          $(".chat-body").scrollTop($(".chat-body")[0].scrollHeight);
        });
      });
    });
  </script>
</body>
</html>
